name: Template validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: bash scripts/validate.sh
      - name: Check required template files
        run: |
          test -f AGENTS.md
          test -f docs/PROJECT.md
          test -f docs/ARCHITECTURE.md
          test -f .agents/skills/plan-task/SKILL.md
          test -f .agents/skills/test-and-fix/SKILL.md
