name: Feature request
description: Propose a clearly scoped product or engineering change
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior and acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is intentionally outside this task?
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and decisions
      description: Include platforms, compatibility, security, data, dependency, and design constraints.
  - type: textarea
    id: evidence
    attributes:
      label: References or evidence
      description: Add mockups, logs, screenshots, related issues, or documentation.
