name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include errors, logs, screenshots, environment, and version information. Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or suspected scope
      description: Note compatibility, data, security, or regression concerns.
